<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facebook Login for Business</title>
</head>
<body>

    <!-- The Login Trigger Button -->
    <button onclick="launchBusinessLogin()">Log in with Facebook Business</button>

    <script>
        // 1. Initialize the SDK automatically when it loads
        window.fbAsyncInit = function() {
            FB.init({
                appId   : '1094705089173300', // Replace with your Meta App ID
                cookie  : true,               // Enable cookies for server-side access
                xfbml   : true,               // Parse social plugins on the page
                version : 'v26.0'             // Use the latest Meta Graph API version
            });
        };

        // 2. Load the Meta JavaScript SDK asynchronously
        (function(d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/en_US/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));

        // 3. Trigger the Login Dialog with Business Configuration
        function launchBusinessLogin() {
            FB.login(function(response) {
                if (response.authResponse) {
                    // Exchange this code on the server for an access token.
                    const authorizationCode = response.authResponse.code;
                    console.log('Authorization code:', authorizationCode);
                } else {
                    console.error('Facebook login failed or was cancelled.', {
                        status: response.status,
                        error: response.error,
                        errorDescription: response.error_description
                    });
                }
            }, {
                // CRITICAL: The configuration ID generated in your Meta App Dashboard
                config_id: '1413007240957562',
                response_type: 'code',
                override_default_response_type: true
            });
        }

    </script>
</body>
</html>
